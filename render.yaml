services:
  - type: web
    name: jlb-sports
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn jlb_sports.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false  # Lo ingresas manualmente en el dashboard de Render
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@jlbsports.com"
